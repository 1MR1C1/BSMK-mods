# Keeps the star score on the store cards real. Reviews are comments on a "[reviews] <mod id>" issue, each
# carrying a hidden BSMK-RATING:<1-5> marker (the launcher writes it). Whenever one is posted, edited or
# deleted, this recounts that mod and writes rating + ratingCount into index.json, so every player sees the
# same score without opening the mod. Run it by hand to recount every mod at once.
# Reviews listed in hidden-comments.json (hidden by the review robot or the owner) don't count. The review
# robot and the admin app start a full recount whenever they hide or show one.
name: Review stats

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# shares the queue with the other jobs that write index.json, so they can't overwrite each other
concurrency:
  group: store-index
  cancel-in-progress: false

jobs:
  recount:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[reviews] ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const marker = /BSMK-RATING:(\d)/;

            let hidden = new Set();
            try {
              const h = await github.rest.repos.getContent({ owner, repo, path: 'hidden-comments.json' });
              hidden = new Set((JSON.parse(Buffer.from(h.data.content, 'base64').toString('utf8')).Comments || []).map(e => e.id));
            } catch {}

            // same rule as the mod page in the launcher: every comment with a star marker is one rating
            async function score(issueNumber) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 });
              const stars = comments.filter(c => !hidden.has(c.id)).map(c => marker.exec(c.body || '')).filter(Boolean).map(m => Number(m[1]));
              const average = stars.length ? Math.round(stars.reduce((a, b) => a + b, 0) / stars.length * 10) / 10 : 0;
              return { rating: average, ratingCount: stars.length };
            }

            const scores = {};
            if (context.eventName === 'workflow_dispatch') {
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
              for (const issue of issues)
                if (!issue.pull_request && issue.title.startsWith('[reviews] '))
                  scores[issue.title.slice(10).trim()] = await score(issue.number);
            } else {
              scores[context.payload.issue.title.slice(10).trim()] = await score(context.payload.issue.number);
            }

            const file = await github.rest.repos.getContent({ owner, repo, path: 'index.json' });
            const index = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
            const mods = Array.isArray(index) ? index : index.mods;
            const changed = [];
            for (const mod of mods) {
              const s = scores[mod.id];
              if (!s || (mod.rating === s.rating && mod.ratingCount === s.ratingCount)) continue;
              mod.rating = s.rating;
              mod.ratingCount = s.ratingCount;
              changed.push(`${mod.id} ${s.rating} (${s.ratingCount})`);
            }
            if (!changed.length) { core.info('nothing to change'); return; }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'index.json', sha: file.data.sha,
              message: 'store: review score ' + changed.join(', '),
              content: Buffer.from(JSON.stringify(index, null, 2), 'utf8').toString('base64'),
            });
            core.info('updated ' + changed.join(', '));
